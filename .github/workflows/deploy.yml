name: Deploy to VPS

on:
  push:
    branches: [main]

# Chi 1 deploy chay tai 1 thoi diem
concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10'

jobs:
  # Cho CI pass truoc khi deploy
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to VPS
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.VPS_HOST }} << 'DEPLOY'
            set -e
            echo "=== Pull latest code ==="
            cd /var/www/reloop
            git pull origin main

            echo "=== Install dependencies ==="
            pnpm install --frozen-lockfile

            echo "=== Build (standalone) ==="
            STANDALONE_BUILD=1 NODE_ENV=production pnpm build

            echo "=== Copy static assets ==="
            cp -r .next/static .next/standalone/.next/static
            cp -r public .next/standalone/public

            echo "=== Restart PM2 ==="
            pm2 restart reloop --update-env
            pm2 save

            echo "=== Health check ==="
            sleep 3
            HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/)
            if [ "$HTTP_CODE" != "200" ]; then
              echo "ERROR: Health check failed with HTTP $HTTP_CODE"
              pm2 logs reloop --lines 20 --nostream
              exit 1
            fi
            echo "Deploy OK — HTTP $HTTP_CODE"
          DEPLOY

      - name: Notify on failure
        if: failure()
        run: echo "::error::Deploy to VPS failed! Check logs above."

